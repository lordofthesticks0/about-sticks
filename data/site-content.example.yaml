music:
  subtitle: "lol i had to change the colours because apple music embeds can't be assed"
  warning: "warning: the embeds are LOUD, i can't change their volumes."
  tracks:
    - id: brick-by-boring-brick
      title: Brick by Boring Brick
      artist: Paramore
      description: >-
        this song describes about how jean paramore aka hayley williams grows up from living in a "fairy tale somewhere too far for us to find". this song is genuinely personal to me because i grew up the same way. lived in a fairy tale where everything was fine but i never was. i had to fix myself brick by boring brick BUT ENOUGH ABOUT ME this song is amazing
      quote: "The angles were all wrong now she's ripping wings off of butterflies"
      link: https://music.apple.com/us/song/brick-by-boring-brick/607337423
    - id: a-match-into-water
      title: A Match Into Water
      artist: Pierce The Veil
      description: >-
        this song is meant to describe vic fuentes' girlfriend, who was diagnosed with breast cancer at the time. bro was NOT kidding when he said the chemicals will bring her home again. while i don't really have a sickly girlfriend (or anyone really), i can highkey somewhat relate to his concerns of being afraid to be left alone early, and some lines are particularly relatable in isolation
      quote: "Bring her back or take me with her!"
      link: https://music.apple.com/us/song/a-match-into-water/1440941958
    - id: hate-to-see-your-heart-break-feat-joy-williams
      title: "Hate to See Your Heart Break (feat. Joy Williams)"
      artist: Paramore
      description: >-
        wow another paramore can you tell i like them? but like for real i don't think i've ever heard two voices marry so naturally like OH MY GOD. there should've been more of these two!!!!! the song itself talks about jean paramore trying to help her bandmate taylor york when he's going through a breakup, as she herself went through plenty of them. it's a really endearing song about seeing someone so close to you get hurt so badly :((
      quote: "For all the joy that is to come,"
      link: https://music.apple.com/us/song/hate-to-see-your-heart-break-feat-joy-williams/942088625
    - id: lacy
      title: lacy
      artist: Olivia Rodrigo
      description: >-
        this one is a genuinely interesting, you can't really tell if it's about love or jealousy. the whole album is actually about jealousy so you can kinda infer from that, but still i actually really relate to this song. she took a poetry class for this song and then just forgot about it i guess???? nothing she made until now is even remotely close to being this expressive
      quote: "i despise my jealous eyes and how hard they fell for you"
      link: https://music.apple.com/us/song/lacy/1694386831
    - id: pushing-daisies-oh-my-my
      title: Pushing Daisies (Oh My My)
      artist: Friday Pilots Club
      description: >-
        i can't find the background for this song actually, nobody knows, but it does describe someone basically going insane over seeing their partner get taken by someone else if you try to look into it. honestly though it has a pretty catchy chorus and is just in general pretty singable
      quote: "For you I'd give the whole damn lot; But tell me what good is all I got?"
      link: https://music.apple.com/us/song/pushing-daisies-oh-my-my/1697320217

  albums:
    - id: paramore
      title: Paramore
      artist: Paramore
      description: >-
        despite the name this is actually NOT their debut album, this is their like, their third. their last album brand new eyes was filled with internal conflict in the band, so they were meant to be "reborn" in a way here. as for the music i mean i'm obv biased but they cooked or something yea :D
      link: https://music.apple.com/us/album/paramore-deluxe-edition/942088604
    - id: guts-spilled
      title: GUTS (spilled)
      artist: Olivia Rodrigo
      description: >-
        mostly talks about how she herself grew up and the difficulties she face. even though i don't really relate too much, but the album itself is an experiment, it's not just 'pure' pop like her previous album, but this one actually have rock elements inside. i really like it, she's leaning to something like avril lavigne and she lowkey cooked.
      link: https://music.apple.com/us/album/guts-spilled/1736994915
    - id: collide-with-the-sky
      title: "Collide With The Sky"
      artist: Pierce The Veil
      description: >-
        this album is like the most metal i can get before getting scared off, i used to listen to like some weird shit japanese melodic death metal or whatever. i've discovered that i like it when i can understand what they're singing now.  with this album though, apparently they were experimenting and they were just straight up homeless. they're homeless and they're not even taking safe steps i think i like that. if You Know then Yes I Am Trying To Ignore It
      link: https://music.apple.com/us/album/collide-with-the-sky/1440941951
    - id: petal
      title: petal
      artist: Ariana Grande
      description: >-
        this one is a bit weird, she mostly talks about herself and things i can't relate. she's apparently coming to terms with the "consequences" of being rich and famous. i like it though, it's in the same breath as what taylor swift did, just a lot less of a shameless cash grab (sorry not sorry). she basically converted drama into cash and now everything she does is side eyed, she hates that she made YOU love her.
      link: https://music.apple.com/us/album/petal/1895420989
    - id: short-n-sweet-deluxe
      title: Short n Sweet
      artist: Sabrina Carpenter
      description: >-
        this was basically after she's not playing it safe anymore, she's all mature and grow up and talks and sings about whatever the fuck she wants. there's a rebellious story behind the album and i highkey dig it. also yeah it's a vibe.
      link: https://music.apple.com/us/album/short-n-sweet-deluxe/1795512297

games:
  steamId: "76561199002412925"
  title: games
  subtitle: "top 10 games of the history of mankind (objectively correct)"
  items:
    - appId: 1384160
      title: Guilty Gear -STRIVE-
      description: >-
        people say it's for casuals... i lowkey agree..... BUT IT'S FUN!!! i am not going to pretend like learning 182 different gatlings per character on GGXrd or GGACPR is fun at all. because it's not. universalized gatlings is beautiful, the characters i play are fun enough and isn't wholly gutted so that's why i put up with it. first fighting game i ever played and still the most fun i ever had. genuine 10/10. absolute sweep.
    - appId: 1030300
      title: "Hollow Knight: Silksong"
      description: >-
        I HATE YOU TEAM CHERRY FOR MAKING ME LOVE THIS GAME!!!!!!!!!! it's hard yes (and genuine RAGEBAIT btw) but the movement is sooooo fun sometimes you almost forgot you had to walk back like 3 hours just to refight a boss. it's one of those games you remember being so fun but when you actually play it all you feel is dread, pain, and suffering. still fun tho <3
    - appId: 391540
      title: UNDERTALE
      description: >-
        this game pretty much shaped my childhood (and a lot of other people too). opened my worldview and made me like, woke or something. probably the first time i ever felt any emotion on a video game. (i swear i played more than 3 minutes i pirated it when i was a kid :D)
    - appId: 526870
      title: Satisfactory
      description: >-
        yet another casual game. you play this game, look at the clock, see it's 5, keep looking at the screen, then look at the clock again. still points to 5, but the sun is rising again for some reason.
    - appId: 367520
      title: Hollow Knight
      description: >-
        just cause the second game is number 2 don't mean i can't put the first one here LMAOOOOO like okay, the first one is still a really, really, really, really, really, really, really, really, REALLY good game on its own. it's fun mechanically, it's fun story wise, what can i say team cherry cooks i guess :D
    - appId: 504230
      title: Celeste
      description: >-
        the one word to describe the game is probably 'movementslop', like the sole reason it's so fun is because you zip around everywhere in lightning speed and it's just so fun doing that sometimes
    - appId: 105600
      title: Terraria
      description: >-
        fun with friends, fun alone (sometimes), fun pretty much any time. devs are sweethearts too i can't lie. modding is also like, HUGE in this game. you'll never get bored. one of the best time sinks i've ever bought
    - appId: 1778820
      title: TEKKEN 8
      description: >-
        WHY IS THIS HERE I HATE THIS GAME WHY DO I KEEP PLAYING IT??????? ragebait game 5/10 at best
    - appId: 275850
      title: "No Man's Sky"
      description: >-
        if i was creative and willing to put the time (and have friends to play this with) i would have like a trillion hours. one of its shortcomings is unfortunately that there's really so much to do but you don't really know why you should do them.
    - appId: 548430
      title: Deep Rock Galactic
      description: >-
        usually i hate shooters. this one is the exception. i'm still ass at aiming and allat but like, i can't deny the dumb fun of just shooting bugs and mining ores. has the same problem with no man's sky though, it gets boring without friends
